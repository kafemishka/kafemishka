  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <a class="logo" href="index.html">Кафе Mishka<span>Kafe Mishka</span></a>
    <nav>
      <a href="trip-and-transform.html">Trip &amp; Transform</a>
      <a class="here" href="ceramics.html">Ceramics</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="style.html">Style</a>
      <a href="exhibition.html">Exhibition</a>
    </nav>
  </header>

  <div class="page-title">
    <h1>Ceramics</h1>
    <!-- EDIT ME: the blurb about your ceramics -->
    <p>Kafe Mishka Ceramics, est. 2026</p>
  </div>

  <!-- Everything in the "ceramics" folder shows up here automatically,
       sorted into the sections listed at the bottom of this file. -->
  <!-- Sticky menu: filled in automatically with the sections below -->
  <div class="spy lower" id="spy"></div>
  <p class="soon">Pieces coming soon</p>
  <div id="ceramics"></div>

  <footer>
    <span>© 2026 Кафе Mishka</span>
    <a href="index.html">← Home</a>
  </footer>

</div>

<script src="site.js"></script>
<script>
  /* ===== CERAMICS SECTIONS =====  EDIT ME
     Each section collects the photos whose file names START with
     one of its prefixes, in number order. Titles appear exactly as
     typed. Sections appear in this order, and each one gets a
     button in the sticky menu at the top.

     layout:   "float" = airy gallery, mixed sizes
               "bunch" = tight grouped cluster
               "row"   = one straight row
     shuffle:  true = new random order on every visit
     inside:   a smaller sub-group shown inside the section above it
     captions: a short line under one specific photo                 */
  const SECTIONS = [
    { title: "finished pieces",     prefixes: ["img_"],      layout: "float", shuffle: true },
    { title: "horse hair raku",     prefixes: ["horsehair"], layout: "bunch" },
    { title: "M+N collab",          prefixes: ["collab"],    layout: "bunch" },
    { title: "utilitarian pottery", prefixes: ["inuse"],     layout: "bunch",
      inside: { title: "ginger cookie anyone?", prefixes: ["cookie"], layout: "row" } },
    { title: "in the studio",       prefixes: ["studio", "kafe"], layout: "bunch",
      captions: { kafemishkabag: "pottery bag embroidery by NR" } },
  ];
  // Photos that match no section are shown at the very end, untitled.

  const slug = t => "s-" + t.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

  function render(files, layout, shuffle, captions) {
    if (layout === "float") return renderFloat(files, shuffle);
    const box = document.createElement("div");
    box.className = layout;                         // "bunch" or "row"
    if (layout === "row") box.style.setProperty("--n", files.length);
    files.forEach((f, i) => {
      const img = makeImg(f, files, i);
      img.loading = "eager";
      const cap = captions && captions[baseName(f).toLowerCase()];
      if (cap) {
        const fig = document.createElement("figure");
        fig.className = "cap";
        const fc = document.createElement("figcaption");
        fc.textContent = cap;
        fig.append(img, fc);
        box.appendChild(layout === "bunch" ? reveal(fig) : fig);
      } else {
        box.appendChild(layout === "bunch" ? reveal(img) : img);
      }
    });
    if (layout === "row") return reveal(box);
    const holder = document.createElement("div");   // cluster drifts gently on scroll
    holder.dataset.speed = 0.05;
    holder.appendChild(box);
    return holder;
  }

  function heading(tag, text, cls) {
    const h = document.createElement(tag);
    h.className = cls; h.textContent = text;
    return h;
  }

  (async () => {
    const page = document.getElementById("ceramics");
    const spy = document.getElementById("spy");
    const all = await imagesIn("ceramics");
    if (!all.length) { spy.remove(); return; }
    dropSoon(page);
    const used = new Set();
    const take = prefixes => all.filter(p => !used.has(p) &&
      prefixes.some(x => baseName(p).toLowerCase().startsWith(x.toLowerCase())))
      .map(p => (used.add(p), p));

    const built = SECTIONS.map(sec => ({
      sec, files: take(sec.prefixes),
      sub: sec.inside ? { ...sec.inside, files: take(sec.inside.prefixes) } : null }));
    const leftover = all.filter(p => !used.has(p));

    built.forEach(({ sec, files, sub }) => {
      if (!files.length && !(sub && sub.files.length)) return;
      const wrap = document.createElement("section");
      wrap.className = "cer-section block";
      wrap.id = slug(sec.title);
      wrap.appendChild(reveal(heading("h2", sec.title, "cer-title")));
      if (files.length) wrap.appendChild(render(files, sec.layout, sec.shuffle, sec.captions));
      if (sub && sub.files.length) {
        wrap.appendChild(reveal(heading("h3", sub.title, "cer-subtitle")));
        wrap.appendChild(render(sub.files, sub.layout, false, sub.captions));
      }
      page.appendChild(wrap);
      const a = document.createElement("a");
      a.href = "#" + wrap.id; a.textContent = sec.title;
      spy.appendChild(a);
    });

    if (leftover.length) {
      const wrap = document.createElement("section");
      wrap.className = "cer-section";
      wrap.appendChild(render(leftover, "bunch", false));
      page.appendChild(wrap);
    }
    if (spy.children.length < 2) spy.remove(); else scrollSpy("spy");
  })();
</script>
</body>
</html>
